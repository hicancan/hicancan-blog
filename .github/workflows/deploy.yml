name: Deploy static site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-site-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload EdgeOne artifact
        uses: actions/upload-artifact@v7
        with:
          name: edgeone-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download EdgeOne artifact
        if: ${{ vars.EDGEONE_PAGES_ENABLED == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: edgeone-dist
          path: dist

      - name: Setup Node.js
        if: ${{ vars.EDGEONE_PAGES_ENABLED == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deploy to EdgeOne Pages
        if: ${{ vars.EDGEONE_PAGES_ENABLED == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
          EDGEONE_PAGES_AREA: ${{ vars.EDGEONE_PAGES_AREA }}
        run: |
          if [ -z "${EDGEONE_API_TOKEN}" ]; then
            echo "::error::EDGEONE_API_TOKEN secret is required"
            exit 1
          fi
          if [ -z "${EDGEONE_PROJECT_NAME}" ]; then
            echo "::error::EDGEONE_PROJECT_NAME variable is required"
            exit 1
          fi
          area="${EDGEONE_PAGES_AREA:-overseas}"
          echo "Deploying dist to EdgeOne Pages project '${EDGEONE_PROJECT_NAME}' in area '${area}'."
          npx --yes edgeone@latest pages deploy dist \
            -n "${EDGEONE_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e production \
            -a "${area}"

      - name: Purge Cloudflare Cache
        if: ${{ vars.CF_PURGE_ENABLED == '1' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "Skip purge: CF_API_TOKEN or CF_ZONE_ID is not set."
            exit 0
          fi
          if ! curl --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'; then
            echo "::warning::Cloudflare cache purge failed; static site deployments already completed."
          fi
